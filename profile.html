<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - Nura Authentication System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                Nura Authentication System
            </span>

            <button type="button" id="logoutBtn" class="btn btn-outline-light btn-sm">
                Logout
            </button>
        </div>
    </nav>


    <!-- Profile -->
    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-8 col-lg-7">

                <div class="card shadow">

                    <div class="card-body p-4">

                        <h2 class="text-center mb-4">
                            My Profile
                        </h2>

                        <div id="message"></div>

                        <form id="profileForm">

                            <!-- Username -->
                            <div class="mb-3">
                                <label for="username" class="form-label">
                                    Username
                                </label>

                                <input
                                    type="text"
                                    id="username"
                                    class="form-control"
                                    readonly>
                            </div>


                            <!-- Email -->
                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    class="form-control"
                                    readonly>
                            </div>


                            <!-- Full Name -->
                            <div class="mb-3">
                                <label for="fullName" class="form-label">
                                    Full Name
                                </label>

                                <input
                                    type="text"
                                    id="fullName"
                                    name="fullName"
                                    class="form-control"
                                    placeholder="Enter your full name"
                                    required>
                            </div>


                            <!-- Age -->
                            <div class="mb-3">
                                <label for="age" class="form-label">
                                    Age
                                </label>

                                <input
                                    type="number"
                                    id="age"
                                    name="age"
                                    class="form-control"
                                    min="1"
                                    max="120"
                                    placeholder="Enter your age">
                            </div>


                            <!-- Bio -->
                            <div class="mb-3">
                                <label for="bio" class="form-label">
                                    Bio
                                </label>

                                <textarea
                                    id="bio"
                                    name="bio"
                                    class="form-control"
                                    rows="4"
                                    placeholder="Tell us about yourself"></textarea>
                            </div>


                            <!-- Interests -->
                            <div class="mb-3">
                                <label for="interests" class="form-label">
                                    Interests
                                </label>

                                <input
                                    type="text"
                                    id="interests"
                                    name="interests"
                                    class="form-control"
                                    placeholder="Example: Coding, IoT, Music">
                            </div>


                            <!-- Save -->
                            <button
                                type="submit"
                                id="saveProfileBtn"
                                class="btn btn-primary w-100">
                                Save Profile
                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Profile JavaScript -->
    <script src="js/profile.js"></script>

</body>

</html>
